services:
  db:
    image: postgres:15
    container_name: lrp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: lrp_proyectos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lrp_proyectos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lrp_proyectos_app
    restart: unless-stopped
    ports:
      - "3026:3000"
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/lrp_proyectos?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
